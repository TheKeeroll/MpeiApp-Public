# Install as dragonet-subscription-proxy@<certificate-name>.service.d/20-s-ui-tls.conf.
# Reset the Certbot sources: otherwise a missing /etc/letsencrypt pair prevents
# systemd from starting Node, before the application's TLS discovery can run.
[Service]
LoadCredential=
LoadCredential=fullchain.pem:/root/cert/%i/fullchain.pem
LoadCredential=privkey.pem:/root/cert/%i/privkey.pem
