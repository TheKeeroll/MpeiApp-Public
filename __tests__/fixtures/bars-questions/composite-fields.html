            function getAnswer() {
                 var answer = {};
                 answer.error = "";

                 var answers = [];
                 var answerValue;
                 var data_qi;

                 var $qiEmployeeID = $("#qiEmployeeID");
                 if ($qiEmployeeID.length === 0) {
                     answer.error = "Не удалось обработать один из вопросов";
                     return answer;
                 }

                 var empVal = $qiEmployeeID.val();
                 data_qi = $qiEmployeeID[0].getAttribute("data-qi");
                 if (data_qi === null || data_qi === undefined) {
                    answer.error = "Не удалось обработать один из вопросов";
                    return answer;
                 }
                 answerValue = data_qi + "|p|" + empVal;
                 answers.push(answerValue);

                 var $qi0_10 = $("#qi0_10");
                 if ($qi0_10.length === 0) {
                     answer.error = "Не удалось обработать один из вопросов";
                     return answer;
                 }

                 data_qi = $qi0_10[0].getAttribute("data-qi");
                 if (data_qi === null || data_qi === undefined) {
                     answer.error = "Не удалось обработать один из вопросов";
                     return answer;
                 }

                 var radio = $qi0_10.find("input[type='radio']:checked");
                 if (radio.length === 0) {
                     answer.error = "Не удалось обработать один из вопросов";
                     return answer;
                 }

                 var radioValue = radio[0].value;
                 answerValue = data_qi + "|p|" + radioValue;
                 answers.push(answerValue);

                 var $qiOpen = $("#qiOpen");
                 if ($qiOpen.length === 0) {
                     answer.error = "Не удалось обработать один из вопросов";
                     return answer;
                 }

                 data_qi = $qiOpen[0].getAttribute("data-qi");
                 if (data_qi === null || data_qi === undefined) {
                     answer.error = "Не удалось обработать один из вопросов";
                     return answer;
                 }

                 answerValue = data_qi + "|p|" + $qiOpen.val();
                 answers.push(answerValue);

                 answer.value = answers.join("|a|");
                 return answer;
             }
