<script>
    
        function getAnswer() {
            var answer = {};
            answer.error = "";
            var $radios = $("#tblQuestion tr[data-qi] input[type='radio']:checked");

            if ($radios.length === 0) {
                answer.error = "Не удалось определить ответ";
                return answer;
            }

            var $tr = $radios.closest("tr");
            if ($tr.length === 0) {
                answer.error = "Не удалось определить ответ";
                return answer;
            }

            var data_qi = $tr[0].getAttribute("data-qi");

            if (data_qi === null || data_qi === undefined) {
                answer.error = "Не удалось определить ответ";
                return answer;
            }

            var radio = $radios[0];
            var data_qit = radio.getAttribute("data-qit");

            if (data_qit === '1') {
                answer.value = data_qi;
            } else if (data_qit === '3') {
                var radioID = radio.id;
                var radioID_value = radioID + '_value';

                var answerValue = $('#' + radioID_value).val();

                if (answerValue === "") {
                    answer.error = "Необходимо заполнить поле с ответом";
                    return answer;
                }

                answer.value = data_qi + "|p|" + answerValue;
            }

            return answer;
        }

        $(document).ready(function() {
            $("#tblQuestion tr[data-qi] input[type='radio']").click(function(e) {
                var radio = e.target;
                var data_qit = radio.getAttribute("data-qit");

                if (data_qit === '1') {
                    $("#tblQuestion tr[data-qi] textarea").hide();
                } else if (data_qit === '3') {
                    var radioID = radio.id;
                    var radioID_value = radioID + '_value';
                    $('#' + radioID_value).show();
                }
            });
        });

    
</script>
